        const dataLen = d.length / 2;
        const lenLE = (dataLen & 0xFF).toString(16).padStart(2,'0') +
                      ((dataLen >> 8) & 0xFF).toString(16).padStart(2,'0');
        // DUHA帧头 (HUD上报)
        return ("44554841" + lenLE + "0900000000" + d + "0000").toUpperCase();
    }

    // IIC 0x0005 示例 (强光传感器值)
    function buildIic0005Example() {
        let d = "";
        d += "01F4";   // FW前照 = 500
        d += "012C";   // IR采集 = 300
        d += "0190";   // AMB环境 = 400
        d += "0208";   // HUD前照 = 520
        const dataLen = d.length / 2;
        const lenLE = (dataLen & 0xFF).toString(16).padStart(2,'0') +
                      ((dataLen >> 8) & 0xFF).toString(16).padStart(2,'0');
        // 使用 TOAD 请求帧头 (APK→HUD)
        return ("544F4144" + lenLE + "0500000000" + d + "0000").toUpperCase();
    }

    // ==================== UI 状态管理 ====================
    let currentProject = 'H37A';       // 当前选中的硬件项目 key
    let currentProtocol = 'iic';       // 当前协议类型 (canfd / iic)
    let currentParseVersion = 'V2.16'; // 实际用于解析的协议版本（CANFD=V1.18, IIC=V2.16）
    let currentParserVariant = 'H37A'; // 当前项目的解析器变体

    function populateProjectSelector() {
        const select = document.getElementById('projectSelect');
        select.innerHTML = '';
        Object.keys(PROJECTS).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            const proj = PROJECTS[key];
            opt.textContent = proj.label + ' · ' + proj.swVersion;
            if (key === 'H37A') opt.selected = true;
            select.appendChild(opt);
        });
    }

    function updateFooter() {
        const proj = PROJECTS[currentProject];
        const projLabel = proj.label + ' · ' + proj.swVersion;
        document.getElementById('footerText').textContent =
            `岚图HUD报文解析工具 · ${projLabel} · 解析器: ${currentParserVariant} · 协议版本 ${currentParseVersion}`;
    }

    function updateUIForProject() {
        const projInfo = PROJECTS[currentProject];
        currentProtocol = projInfo.protocol;
        currentParserVariant = projInfo.parserVariant || currentProject;
        // 协议版本固定：CANFD→V1.18, IIC→V2.16
        currentParseVersion = currentProtocol === 'canfd' ? 'V1.18' : 'V2.16';

        // 更新协议类型和软件版本标签
        const protocolLabel = currentProtocol === 'canfd' ? '🚗 CANFD协议 V1.18' : '📡 IIC协议 V2.16';
        document.getElementById('protocolBadge').textContent = protocolLabel;
        document.getElementById('protocolBadge').className = 'badge supported';
        document.getElementById('swVersionBadge').textContent = '🔖 ' + projInfo.swVersion;
        document.getElementById('swVersionBadge').className = 'badge';

        const protoVer = getProtoVersion(currentProtocol);
        document.getElementById('supportedCmdBadge').textContent = '📋 ' + protoVer.supportedCmds.join(', ');
        document.getElementById('supportedCmdBadge').className = 'badge';

        const btn1 = document.getElementById('example1Btn');
        const btn2 = document.getElementById('example2Btn');
        const btn3 = document.getElementById('example3Btn');
        const btn4 = document.getElementById('example4Btn');
        const btn5 = document.getElementById('example5Btn');

        if (currentProtocol === 'canfd') {
            btn1.style.display = ''; btn2.style.display = ''; btn3.style.display = '';
            btn4.style.display = 'none'; btn5.style.display = 'none';
            btn1.textContent = '📋 F1示例'; btn2.textContent = '📋 F7示例'; btn3.textContent = '📋 F5示例';
        } else {
            btn1.style.display = 'none'; btn2.style.display = 'none'; btn3.style.display = 'none';
            btn4.style.display = ''; btn5.style.display = '';
            btn4.textContent = '📋 IIC 0x0009'; btn5.textContent = '📋 IIC 0x0005';
        }

        updateFooter();
    }

    // ==================== UI 事件处理 ====================
    const textarea = document.getElementById('hexInput');
    const parseBtn = document.getElementById('parseBtn');
    const resultDiv = document.getElementById('resultContainer');
    const projectSelect = document.getElementById('projectSelect');

    projectSelect.addEventListener('change', function() {
        currentProject = this.value;
        updateUIForProject();
    });

    function setExample(type) {
        let exampleHex = '';
        switch(type) {
            case 'f1': exampleHex = EXAMPLE_F1; break;
            case 'f7': exampleHex = buildF7Example(); break;
            case 'f5': exampleHex = buildF5Example(); break;
            case 'iic0009': exampleHex = buildIic0009Example(); break;
            case 'iic0005': exampleHex = buildIic0005Example(); break;
        }
        textarea.value = exampleHex;
        const labelMap = {
            'f1': 'CANFD 0xF1 心跳报文',
            'f7': 'CANFD 0xF7 日志信息2',
            'f5': 'CANFD 0xF5 设备信息上报',
            'iic0009': 'IIC 0x0009 调试日志',
            'iic0005': 'IIC 0x0005 强光传感器'
        };
        resultDiv.innerHTML = `<div class="info-msg">✨ 已填充 ${labelMap[type]} 示例报文，点击"解析报文"查看结果</div>`;
    }

    function clear() {
        textarea.value = '';
        resultDiv.innerHTML = `<div style="color:#6c757d; padding:20px; text-align:center;">等待输入报文...<br><small>选择项目并输入版本号后，粘贴十六进制报文进行解析</small></div>`;
    }

    function doParse() {
        const rawHex = textarea.value.trim();
        if (!rawHex) {
            resultDiv.innerHTML = `<div class="error-msg">❌ 请输入十六进制报文</div>`;
            return;
        }
        try {
            const result = parseMessage(rawHex, currentProtocol, currentParseVersion, currentParserVariant);
            const html = renderResult(result, currentProtocol, currentParseVersion, currentParserVariant);
            resultDiv.innerHTML = html;
        } catch (err) {
            resultDiv.innerHTML = `<div class="error-msg">⚠️ 解析失败: ${err.message}</div>`;
            console.error(err);
        }
    }

    parseBtn.addEventListener('click', doParse);
    document.getElementById('example1Btn').addEventListener('click', () => setExample('f1'));
    document.getElementById('example2Btn').addEventListener('click', () => setExample('f7'));
    document.getElementById('example3Btn').addEventListener('click', () => setExample('f5'));
    document.getElementById('example4Btn').addEventListener('click', () => setExample('iic0009'));
    document.getElementById('example5Btn').addEventListener('click', () => setExample('iic0005'));
    document.getElementById('clearBtn').addEventListener('click', clear);

    // 初始化
    populateProjectSelector();
    updateUIForProject();
    clear();
})();
</script>
</body>
</html>
